name: Integration Tests

# Runs the live integration tests against a Databricks SQL warehouse.
# Manual trigger only: requires DATABRICKS_HOST, DATABRICKS_TOKEN, and
# DATABRICKS_WAREHOUSE_ID secrets (see planning/integration-test-setup.md).
on:
  workflow_dispatch:

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify secrets are configured
        run: |
          missing=""
          [ -z "$DATABRICKS_HOST" ] && missing="$missing DATABRICKS_HOST"
          [ -z "$DATABRICKS_TOKEN" ] && missing="$missing DATABRICKS_TOKEN"
          [ -z "$DATABRICKS_WAREHOUSE_ID" ] && missing="$missing DATABRICKS_WAREHOUSE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Run integration tests
        # --max-parallel-test-modules 1: the integration suites share fixed Delta tables in
        # one warehouse, and Delta uses optimistic concurrency — running the assemblies in
        # parallel makes concurrent DELETE/INSERT on the same table conflict.
        run: dotnet test --configuration Release --filter-trait "Category=Integration" --max-parallel-test-modules 1
