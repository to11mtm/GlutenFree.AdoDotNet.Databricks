name: Release

# Publishes to NuGet when a version tag is pushed.
#
# Two tag shapes, because the EF Core provider is versioned independently — its major tracks
# the EF Core major (10.x), not the repo-wide version:
#   v*         e.g. v0.2.0             -> packs every shippable project except the EF provider
#   efcore-v*  e.g. efcore-v10.0.0     -> packs only GlutenFree.EntityFrameworkCore.Databricks,
#                                         against the ADO.NET version currently in
#                                         Directory.Build.props (which must already be published)
#
# Uses NuGet Trusted Publishing (OIDC): a trusted publishing policy on nuget.org for
# this repo + release.yml exchanges a GitHub OIDC token for a short-lived API key.
# Requires:
#   - the NUGET_USER secret (your nuget.org profile name, not email)
#   - a GitHub environment named "release" (Settings -> Environments), also set as
#     the Environment on the nuget.org trusted publishing policy
on:
  push:
    tags:
      - 'v*'
      - 'efcore-v*'

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Derive version from tag
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "${tag#efcore-v}" != "$tag" ]; then
            echo "efcore=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#efcore-v}" >> "$GITHUB_OUTPUT"
          else
            echo "efcore=false" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          if [ "${{ steps.version.outputs.efcore }}" = "true" ]; then
            dotnet build --configuration Release \
              "/p:EfCoreProviderVersion=${{ steps.version.outputs.version }}"
          else
            dotnet build --configuration Release "/p:Version=${{ steps.version.outputs.version }}"
          fi

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          if [ "${{ steps.version.outputs.efcore }}" = "true" ]; then
            dotnet pack src/GlutenFree.EntityFrameworkCore.Databricks/GlutenFree.EntityFrameworkCore.Databricks.csproj \
              --no-build --configuration Release --output artifacts \
              "/p:EfCoreProviderVersion=${{ steps.version.outputs.version }}" /p:PackEfCoreProvider=true
          else
            dotnet pack --no-build --configuration Release --output artifacts \
              "/p:Version=${{ steps.version.outputs.version }}"
          fi

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
