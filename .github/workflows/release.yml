name: Release

# Publishes to NuGet when a version tag is pushed, e.g. v0.1.0 or v0.2.0-preview.1.
# Uses NuGet Trusted Publishing (OIDC): a trusted publishing policy on nuget.org for
# this repo + release.yml exchanges a GitHub OIDC token for a short-lived API key.
# Requires:
#   - the NUGET_USER secret (your nuget.org profile name, not email)
#   - a GitHub environment named "release" (Settings -> Environments), also set as
#     the Environment on the nuget.org trusted publishing policy
on:
  push:
    tags: ['v*']

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack --no-build --configuration Release --output artifacts
          /p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
